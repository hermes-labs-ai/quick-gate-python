[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygate-ci"
version = "0.2.0"
description = "Python quality gate CLI for Ruff, Pyright, and pytest with bounded auto-repair and escalation artifacts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Hermes Labs", email = "rbosch@lpci.ai" },
]
keywords = [
    "python", "quality-gate", "python-ci", "fail-fast", "lint", "typecheck",
    "pytest", "auto-repair", "deterministic", "ruff", "pyright",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.3,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-json-report>=1.5",
    "ruff>=0.15.11",
    "pyright>=1.1",
    "jsonschema>=4.23",
]

[project.scripts]
pygate = "pygate.cli:main"

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/quick-gate-python"
Documentation = "https://github.com/hermes-labs-ai/quick-gate-python#readme"
Repository = "https://github.com/hermes-labs-ai/quick-gate-python"
Issues = "https://github.com/hermes-labs-ai/quick-gate-python/issues"
Changelog = "https://github.com/hermes-labs-ai/quick-gate-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src/pygate", "schemas/gate-result-v1.schema.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygate"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/gate-result-v1.schema.json" = "pygate/schemas/gate-result-v1.schema.json"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
exclude = ["tests/action-fixture/fail.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: real-subprocess fresh-repository proof; requires ruff/pyright/pygate on PATH, excluded from the default run",
]
