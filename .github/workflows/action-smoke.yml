name: Root action smoke

on:
  push:
    branches:
      - main
      - "codex/pyg-mp-*"
  workflow_dispatch:
    inputs:
      scenario:
        description: Fixture outcome to exercise
        required: true
        default: pass
        type: choice
        options:
          - pass
          - fail

permissions:
  contents: read

jobs:
  clean-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action-source
          persist-credentials: false

      - name: Select fixture scenario
        id: fixture
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REQUESTED_SCENARIO: ${{ inputs.scenario }}
        run: |
          # The action currently owns a fixed artifact name, so each workflow
          # run exercises exactly one scenario without cross-job collisions.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scenario="$REQUESTED_SCENARIO"
          elif [[ "$GIT_REF" == "refs/heads/main" ]]; then
            scenario="fail"
          else
            scenario="pass"
          fi

          if [[ "$scenario" != "pass" && "$scenario" != "fail" ]]; then
            echo "Unsupported smoke scenario: $scenario" >&2
            exit 1
          fi
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"

      - name: Build a clean consumer workspace
        shell: bash
        env:
          SCENARIO: ${{ steps.fixture.outputs.scenario }}
        run: |
          action_source="$RUNNER_TEMP/pygate-action-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fixture_staging="$(mktemp -d "$RUNNER_TEMP/pygate-action-fixture.XXXXXX")"

          cp "$GITHUB_WORKSPACE/action-source/tests/action-fixture/pyproject.toml" "$fixture_staging/"
          cp "$GITHUB_WORKSPACE/action-source/tests/action-fixture/$SCENARIO.py" "$fixture_staging/check.py"
          mv "$GITHUB_WORKSPACE/action-source" "$action_source"

          cp "$fixture_staging/pyproject.toml" "$GITHUB_WORKSPACE/pyproject.toml"
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "PyGate smoke"
          git -C "$GITHUB_WORKSPACE" config user.email "pygate-smoke@example.invalid"
          git -C "$GITHUB_WORKSPACE" add pyproject.toml
          git -C "$GITHUB_WORKSPACE" commit --quiet -m "Initialize clean consumer fixture"

          cp "$fixture_staging/check.py" "$GITHUB_WORKSPACE/check.py"
          git -C "$GITHUB_WORKSPACE" add check.py
          git -C "$GITHUB_WORKSPACE" commit --quiet -m "Add $SCENARIO canary"

          echo "/action-source" >> "$GITHUB_WORKSPACE/.git/info/exclude"
          ln -s "$action_source" "$GITHUB_WORKSPACE/action-source"

      - name: Prove source and consumer separation
        shell: bash
        run: |
          consumer_path="$(realpath "$GITHUB_WORKSPACE")"
          action_path="$(realpath "$GITHUB_WORKSPACE/action-source")"
          printf 'Consumer workspace: %s\nAction source: %s\n' "$consumer_path" "$action_path"

          test "$consumer_path" != "$action_path"
          if [[ "$action_path" == "$consumer_path/"* ]]; then
            echo "Action source unexpectedly resolves inside the consumer workspace" >&2
            exit 1
          fi
          test -f "$action_path/action.yml"
          test -z "$(git status --porcelain)"

      - name: Run the checked-out root action
        id: gate
        uses: ./action-source
        with:
          mode: canary
          repair: "false"
          python-version: "3.12"
          post-comment: "false"

      - name: Record and assert the declared status
        if: always()
        shell: bash
        env:
          ACTUAL_STATUS: ${{ steps.gate.outputs.status }}
          EXPECTED_STATUS: ${{ steps.fixture.outputs.scenario }}
        run: |
          printf 'Expected PyGate status: %s\nDeclared PyGate status: %s\n' \
            "$EXPECTED_STATUS" "$ACTUAL_STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$ACTUAL_STATUS" = "$EXPECTED_STATUS"
          test -f .pygate/gate-result.json

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pygate-smoke-${{ steps.fixture.outputs.scenario }}-${{ github.run_attempt }}
          path: .pygate/
          if-no-files-found: error
          retention-days: 7
